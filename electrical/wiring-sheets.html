<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Industrial Sorting Line, PLC wiring sheets</title>
<style>
@page { size: A3 landscape; margin: 0; }
html, body { margin: 0; padding: 0; background: #ffffff; }
.sheet { width: 420mm; height: 297mm; overflow: hidden; page-break-after: always; break-after: page; }
.sheet:last-child { page-break-after: auto; break-after: auto; }
.sheet img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<div class="sheet"><img src="wiring-supply.svg" alt="Sheet 3: Control supply 24 V DC and emergency stop"></div>
<div class="sheet"><img src="wiring-inputs.svg" alt="Sheet 4: PLC inputs"></div>
<div class="sheet"><img src="wiring-outputs.svg" alt="Sheet 5: PLC outputs"></div>
</body>
</html>
